[package]
name = "pez"
version = "0.5.1"
edition = "2024"
description = "A lockfile-backed plugin manager for fish."
homepage = "https://github.com/tetzng/pez"
readme = "README.md"
repository = "https://github.com/tetzng/pez"
license = "MIT"
keywords = ["fish", "plugin", "manager"]
categories = ["command-line-utilities"]

[workspace]
members = [".", "xtask"]
resolver = "3"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
git2 = { version = "0.21.0", features = [ "https", "vendored-libgit2", "vendored-openssl" ] }
serde = "1.0.228"
serde_derive = "1.0.216"
sha2 = "0.11.0"
tabled = "0.20.0"
toml = "1.1.2"
clap_complete = "4.6.5"
regex = "1.12.3"
futures = "0.3.32"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "sync"] }
anyhow = "1.0.102"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde_json = "1.0.150"
walkdir = "2.5.0"
semver = "1.0.28"
url = "2.5.8"
schemars = { version = "1.2.1", optional = true }

[dev-dependencies]
libc = "0.2"

[features]
schema-gen = ["schemars"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
